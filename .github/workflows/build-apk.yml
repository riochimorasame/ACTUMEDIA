name: Construire l'APK Android

# Lancer à la main : onglet "Actions" > "Construire l'APK Android" > "Run workflow"
# ou en créant un tag de version (ex. v1.0.1).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # nécessaire pour publier le fichier APK dans "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install

      - name: Copier le site dans www (version de secours hors ligne)
        run: |
          mkdir -p www
          cp -r index.html mentions-legales.html politique-cookies.html politique-de-confidentialite.html conditions-utilisation.html \
                app.js videos.js styles.css sw.js manifest.webmanifest logo.png assets www/

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icône de l'application
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-icons/* android/app/src/main/res/

      - name: Numéro de version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Préparer la clé de signature
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Aucune clé KEYSTORE_BASE64 : APK signé avec une clé temporaire. Il s'installera, mais ne pourra pas être mis à jour par-dessus une version précédente."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK (signé avec votre clé)
        if: steps.sign.outputs.signed == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk ../CaptureMedia.apk

      - name: Construire l'APK (clé temporaire)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../CaptureMedia.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Capture Média — version ${{ github.run_number }}
          body: "Application Android. Téléchargez **CaptureMedia.apk** puis ouvrez-le sur votre téléphone."
          files: CaptureMedia.apk
          make_latest: true
